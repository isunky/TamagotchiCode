name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/assets/app.js
      - run: node --check public/assets/data.js
      - run: node --check public/assets/i18n.js
      - run: node --check public/assets/i18n-data.js
      - run: node scripts/validate-locales.mjs
      - run: node --check public/assets/share.js
      - run: node scripts/validate-sharing.mjs
      - run: node --check public/assets/theme.js
      - run: node scripts/validate-theme.mjs
      - run: node scripts/validate.mjs
